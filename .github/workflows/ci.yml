name: CI
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
permissions: {}
jobs:
    git-footprint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version: "1.26.x"
                  cache: false
            - name: Install git-footprint
              run: go install github.com/tamiroh/git-footprint@latest
            - name: Check repository footprint
              run: |
                  git footprint --no-color --no-pager --fail-on info \
                    --allow-identity 'tamiroh <tamiroh71@gmail.com>' \
                    --allow-identity 'tamiroh <79360511+tamiroh@users.noreply.github.com>' \
                    --allow-identity 'tamiroh <tamiroh@users.noreply.github.com>' \
                    --allow-identity 'GitHub <noreply@github.com>' \
                    --allow-identity 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>' \
                    --allow-identity 'dependabot[bot] <support@github.com>' \
                    --allow-identity 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' \
                    --allow-identity 'Copilot <175728472+copilot@users.noreply.github.com>' \
                    --allow-identity 'copilot-swe-agent[bot] <198982749+Copilot@users.noreply.github.com>'
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: ".tool-versions"
            - name: Install modules
              run: npm ci
            - name: Run linters
              run: npm run lint
    format:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: ".tool-versions"
            - name: Install modules
              run: npm ci
            - name: Run Prettier
              run: npm run format:check
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: ".tool-versions"
            - name: Install modules
              run: npm ci
            - name: Run build
              run: npm run build
    unit-test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: ".tool-versions"
            - name: Install modules
              run: npm ci
            - name: Run unit tests
              run: npm run coverage
            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v7.1.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
    workflow-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Check that actions are pinned
              uses: suzuki-shunsuke/pinact-action@v3.0.0
              with:
                  fix: "false"
            - name: Run ghalint
              uses: ./.github/actions/ghalint
