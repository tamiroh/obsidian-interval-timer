name: Release
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    release:
        permissions:
            contents: write
            pull-requests: write
            id-token: write
            attestations: write
            artifact-metadata: write
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  token: ${{ secrets.PAT }}
            - name: Use Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: ".tool-versions"
            - name: Update draft
              id: release-drafter-prepare
              uses: release-drafter/release-drafter@v7.10.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Update version
              run: |
                  node ./bin/version-bump.mjs ${{ steps.release-drafter-prepare.outputs.tag_name }}
            - uses: stefanzweifel/git-auto-commit-action@v7.2.0
              with:
                  commit_message: "Update version to ${{ steps.release-drafter-prepare.outputs.tag_name }}"
            - name: Build
              id: build
              run: |
                  npm ci
                  npm run build --if-present
                  ls
            - name: Attest build provenance
              uses: actions/attest@v4.2.2
              with:
                  subject-path: |
                      main.js
                      styles.css
            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ steps.release-drafter-prepare.outputs.tag_name }}
              run: gh release upload "$TAG_NAME" main.js manifest.json styles.css
            - name: Publish release
              id: release-drafter-publish
              uses: release-drafter/release-drafter@v7.10.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  publish: true
