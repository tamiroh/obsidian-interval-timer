name: Release
on:
    workflow_dispatch:
permissions:
    contents: read
jobs:
    release:
        permissions:
            contents: write
            pull-requests: write
            id-token: write
            attestations: write
            artifact-metadata: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.PAT }}
            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: ".tool-versions"
            - name: Update draft
              id: release-drafter-prepare
              uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Update version
              run: |
                  node ./bin/version-bump.mjs ${{ steps.release-drafter-prepare.outputs.tag_name }}
            - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
              with:
                  commit_message: "Update version to ${{ steps.release-drafter-prepare.outputs.tag_name }}"
            - name: Build
              id: build
              run: |
                  npm ci
                  npm run build --if-present
                  ls
            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      main.js
                      styles.css
            - name: Upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ steps.release-drafter-prepare.outputs.tag_name }}
              run: gh release upload "$TAG_NAME" main.js manifest.json styles.css
            - name: Publish release
              id: release-drafter-publish
              uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  publish: true
