name: Release Drafter

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    update-release-draft:
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: release-drafter/release-drafter@v7.7.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
