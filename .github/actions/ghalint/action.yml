name: ghalint
description: Lint workflows and actions with ghalint
runs:
    using: composite
    steps:
        - name: Install ghalint
          shell: bash
          env:
              VERSION: 1.6.0
              SHA256: eda1af79c1a4a31c2de5831cd1333ad582fa6fa72015f8e9c1c4525d550c1d35
          run: |
              cd "$RUNNER_TEMP"
              curl -fsSL -o ghalint.tar.gz "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${VERSION}/ghalint_${VERSION}_linux_amd64.tar.gz"
              echo "$SHA256  ghalint.tar.gz" | sha256sum --check
              tar -xzf ghalint.tar.gz ghalint
        - name: Lint workflows
          shell: bash
          run: |
              "$RUNNER_TEMP/ghalint" run
        - name: Lint actions
          shell: bash
          run: |
              "$RUNNER_TEMP/ghalint" run-action
